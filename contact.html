<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Athul Sidheeque</title>

  <style>
    body {
      margin: 0;
      background: #0e0e0e;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    nav {
      position: fixed;
      top: 30px;
      right: 40px;
      z-index: 1000;
    }

    nav a {
      color: #ffffff;
      text-decoration: none;
      margin-left: 20px;
      font-size: 14px;
      opacity: 0.7;
      transition: opacity 0.3s;
    }

    nav a:hover { opacity: 1; }

    section { padding: 120px 10%; }

    h1 {
      font-size: 3rem;
      margin-bottom: 40px;
      text-align: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }

    /* Styles the box as a clickable block */
    .box {
      background: #1a1a1a;
      height: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      opacity: 0.7;
      transition: all 0.3s ease;
      color: #ffffff;
      text-decoration: none; /* Removes underline from the whole box */
      border: 1px solid transparent;
    }

    .box span {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
      opacity: 0.5;
    }

    .box:hover {
      opacity: 1;
      background: #222;
      border-color: #444;
    }

    @media (max-width: 600px) {
      h1 { font-size: 2rem; }
      nav { right: 20px; top: 20px; }
    }
  </style>
</head>

<body>

  <nav>
    <a href="index.html">About</a>
    <a href="works.html">Works</a>
    <a href="contact.html">Contact</a>
  </nav>

  <section>
    <h1>Contact</h1>
    <div class="grid">
      
      <a href="mailto:yourmail@example.com" class="box">
        <span>Email</span>
        yourmail@example.com
      </a>

      <a href="https://instagram.com/yourusername" target="_blank" class="box">
        <span>Instagram</span>
        @yourusername
      </a>

      <a href="https://vimeo.com/yourusername" target="_blank" class="box">
        <span>Video Portfolios</span>
        Vimeo
      </a>

    </div>
  </section>

</body>
</html>
