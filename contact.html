<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact — Athul Sidheeque</title>

  <style>
    body {
      margin: 0;
      background: #0e0e0e;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    nav {
      position: fixed;
      top: 30px;
      right: 40px;
    }

    nav a {
      color: #ffffff;
      text-decoration: none;
      margin-left: 20px;
      font-size: 14px;
      opacity: 0.7;
    }

    nav a:hover {
      opacity: 1;
    }

    section {
      padding: 120px 10%;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 40px;
      text-align: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      text-align: center;
    }

    .box {
      background: #1a1a1a;
      height: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      opacity: 0.7;
      transition: opacity 0.3s;
    }

    .box a {
      color: #ffffff;
      text-decoration: none;
      margin-top: 5px;
    }

    .box:hover {
      opacity: 1;
    }
  </style>
</head>

<body>

  <!-- NAV -->
  <nav>
    <a href="index.html">About</a>
    <a href="works.html">Works</a>
    <a href="contact.html">Contact</a>
  </nav>

  <!-- CONTACT SECTION -->
  <section>
    <h1>Contact</h1>
    <div class="grid">
      <div class="box">
        Email
        <a href="mailto:yourmail@example.com">yourmail@example.com</a>
      </div>

      <div class="box">
        Instagram
        <a href="https://instagram.com/yourusername" target="_blank">@yourusername</a>
      </div>

      <div class="box">
        Vimeo
        <a href="https://vimeo.com/yourusername" target="_blank">Vimeo</a>
      </div>
    </div>
  </section>

</body>
</html>
