<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Athul Sidheeque</title>

  <style>
    body {
      margin: 0;
      background: #0e0e0e;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    nav {
      position: fixed;
      top: 30px;
      right: 40px;
      z-index: 10;
    }

    nav a {
      color: #ffffff;
      text-decoration: none;
      margin-left: 20px;
      font-size: 14px;
      opacity: 0.7;
    }

    nav a:hover {
      opacity: 1;
    }

    section {
      padding: 120px 10%;
    }

    .hero {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    h1 {
      font-size: 3rem;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    p {
      opacity: 0.6;
      font-size: 14px;
    }

    h2 {
      font-size: 2rem;
      margin-bottom: 30px;
    }

    .tabs {
      margin-bottom: 40px;
    }

    .tabs span {
      margin-right: 20px;
      cursor: pointer;
      opacity: 0.6;
      font-size: 14px;
    }

    .tabs span:hover {
      opacity: 1;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .box {
      background: #1a1a1a;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      opacity: 0.5;
    }
  </style>
</head>

<body>

  <nav>
    <a href="#about">About</a>
    <a href="#works">Works</a>
    <a href="#contact">Contact</a>
  </nav>

  <!-- HERO -->
  <section class="hero">
    <div>
      <h1>Athul Sidheeque</h1>
      <p>Filmmaker · Photographer</p>
    </div>
  </section>

  <!-- WORKS -->
  <section id="works">
    <h2>Works</h2>

    <div class="tabs">
      <span>Photos</span>
      <span>Videos</span>
    </div>

    <div class="grid">
      <div class="box">Photo / Video 1</div>
      <div class="box">Photo / Video 2</div>
      <div class="box">Photo / Video 3</div>
      <div class="box">Photo / Video 4</div>
    </div>
  </section>

</body>
</html>
