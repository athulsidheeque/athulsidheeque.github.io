<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="favicon-16x16.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Works — Athul Sidheeque</title>

<style>
  body {
    margin: 0;
    background: #0e0e0e;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
  }

  nav {
    position: fixed;
    top: 30px;
    right: 40px;
    z-index: 1000;
  }

  nav a {
    color: #ffffff;
    text-decoration: none;
    margin-left: 20px;
    font-size: 14px;
    opacity: 0.7;
    transition: opacity 0.3s;
  }

  nav a:hover { opacity: 1; }

  section { padding: 120px 10%; }

  h1 { font-size: 2.5rem; margin-bottom: 20px; }

  .tabs {
    margin-bottom: 40px;
    display: flex;
    gap: 20px;
  }

  .tabs span {
    font-size: 14px;
    opacity: 0.6;
    cursor: pointer;
    border-bottom: 1px solid transparent;
    padding-bottom: 5px;
    color: #ffffff;
    transition: opacity 0.3s;
  }

  .tabs span:hover, .tabs span.active {
    opacity: 1;
    border-bottom: 1px solid #fff;
  }

  /* --- MASONRY GRID SYSTEM --- */
  .grid {
    column-count: 3; /* 3 Columns like your drawing */
    column-gap: 30px;
    width: 100%;
  }

  /* Responsive: 2 columns on tablets, 1 on phones */
  @media (max-width: 1000px) { .grid { column-count: 2; } }
  @media (max-width: 600px) { .grid { column-count: 1; } }

  .project-item {
    display: inline-block; /* Prevents items from splitting between columns */
    width: 100%;
    margin-bottom: 40px; /* Space below each project */
  }

  .box {
    background: #1a1a1a;
    width: 100%;
    position: relative;
    overflow: hidden;
    transition: background 0.3s;
    /* Aspect-ratio removed to allow different heights */
  }

  /* For 16:9 videos, we use this container inside the box */
  .video-container {
    position: relative;
    padding-bottom: 56.25%; /* Forces 16:9 ratio for video players */
    height: 0;
  }

  .video-container iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }

  .project-img {
    width: 100%;
    height: auto; /* Respects original image height (Portrait or Landscape) */
    display: block;
  }

  .project-title {
    margin-top: 12px;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.6;
    color: #fff;
    font-weight: 300;
  }

  .content-section { display: none; }
  .content-section.active { display: block; }

  html { scroll-behavior: smooth; }
</style>
  
</head>

<body>

  <nav>
    <a href="index.html">About</a>
    <a href="works.html">Works</a>
    <a href="contact.html">Contact</a>
  </nav>

  <section>
    <h1>Works</h1>

    <div class="tabs">
      <span id="video-tab" class="active" onclick="showSection('video-section', 'video-tab')">Videos</span>
      <span id="photo-tab" onclick="showSection('photo-section', 'photo-tab')">Photos</span>
    </div>

    <div id="video-section" class="content-section active">
      <div class="grid">
        
        <div class="project-item">
          <div class="box">
            <div class="video-container">
              <iframe src="https://player.vimeo.com/video/928421563?h=6bd4eea842&autoplay=1&muted=1&background=1#t=0.5s" frameborder="0" allow="autoplay; fullscreen"></iframe>
            </div>
          </div>
          <div class="project-title">nurdit logo animation</div>
        </div>

        <div class="project-item">
          <div class="box">
            <div class="video-container">
              <iframe src="https://www.youtube.com/embed/uS1-Km2wDNM?autoplay=1&mute=1&controls=0&loop=1&playlist=uS1-Km2wDNM&rel=0&modestbranding=1&start=1" frameborder="0" allow="autoplay; encrypted-media; fullscreen"></iframe>
            </div>
          </div>
          <div class="project-title">chocolate commercial</div>
        </div>

        <div class="project-item">
          <div class="box" style="height: 400px; display:flex; align-items:center; justify-content:center;">Project 3 (Vertical Example)</div>
          <div class="project-title">Film Title Here</div>
        </div>

        <div class="project-item">
          <div class="box">
             <div class="video-container">
              <iframe src="https://player.vimeo.com/video/928421563?background=1" frameborder="0"></iframe>
            </div>
          </div>
          <div class="project-title">Film Title Here</div>
        </div>

      </div>
    </div>

    <div id="photo-section" class="content-section">
      <div class="grid">
        
        <div class="project-item">
          <div class="box">
            <img src="images/apricot-fig.jpg" class="project-img">
          </div>
          <div class="project-title">yoga bar apricot fig</div>
        </div>

        <div class="project-item">
          <div class="box">
            <img src="images/your-tall-photo.jpg" class="project-img">
          </div>
          <div class="project-title">Portraits</div>
        </div>

      </div>
    </div>

  </section>

  <script>
    function showSection(sectionId, tabId) {
      const sections = document.querySelectorAll('.content-section');
      sections.forEach(s => s.classList.remove('active'));

      const tabs = document.querySelectorAll('.tabs span');
      tabs.forEach(t => t.classList.remove('active'));

      document.getElementById(sectionId).classList.add('active');
      document.getElementById(tabId).classList.add('active');
    }
  </script>

</body>
</html>
