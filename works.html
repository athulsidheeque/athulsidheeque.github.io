<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="favicon-16x16.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Works — Athul Sidheeque</title>

<style>
  body {
    margin: 0;
    background: #0e0e0e;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
  }

  nav {
    position: fixed;
    top: 30px;
    right: 40px;
    z-index: 1000;
  }

  nav a {
    color: #ffffff;
    text-decoration: none;
    margin-left: 20px;
    font-size: 14px;
    opacity: 0.7;
    transition: opacity 0.3s;
  }

  nav a:hover { opacity: 1; }

  section { padding: 120px 10%; }

  h1 { font-size: 2.5rem; margin-bottom: 20px; }

  /* Tabs Styling - Fixed for Switching */
  .tabs {
    margin-bottom: 40px;
    display: flex;
    gap: 20px;
  }

  .tabs span {
    font-size: 14px;
    opacity: 0.6;
    cursor: pointer;
    border-bottom: 1px solid transparent;
    padding-bottom: 5px;
    color: #ffffff; /* Prevents purple/blue link colors */
    transition: opacity 0.3s;
  }

  .tabs span:hover, .tabs span.active {
    opacity: 1;
    border-bottom: 1px solid #fff;
  }

  /* Grid Layout - Set to fit 3 items across */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
    gap: 30px;
  }

  .project-item {
    display: flex;
    flex-direction: column;
  }

  .box {
    background: #1a1a1a;
    aspect-ratio: 16 / 9; 
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    transition: background 0.3s;
  }

  .box:hover { background: #252525; }

  .project-title {
    margin-top: 12px;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.6;
    color: #fff;
    font-weight: 300;
  }

  /* Switching Menu Logic */
  .content-section {
    display: none; /* Everything hidden by default */
  }

  .content-section.active {
    display: block; /* Only show active section */
  }

  .video-container {
    position: relative;
    width: 100%;
    height: 100%;
  }

  .video-container iframe {
    width: 100%;
    height: 100%;
  }

  html { scroll-behavior: smooth; }
</style>
  
</head>

<body>

  <nav>
    <a href="index.html">About</a>
    <a href="works.html">Works</a>
    <a href="contact.html">Contact</a>
  </nav>

  <section>
    <h1>Works</h1>

    <div class="tabs">
      <span id="video-tab" class="active" onclick="showSection('video-section', 'video-tab')">Videos</span>
      <span id="photo-tab" onclick="showSection('photo-section', 'photo-tab')">Photos</span>
    </div>

    <div id="video-section" class="content-section active">
      <div class="grid">
        
        <div class="project-item">
          <div class="box">
            <div class="video-container">
             <iframe 
  src="https://player.vimeo.com/video/928421563?h=6bd4eea842&autoplay=1&muted=1&background=1#t=0.5s" 
  frameborder="0" 
  allow="autoplay; fullscreen" 
  style="position:absolute;top:0;left:0;width:100%;height:100%;">
</iframe>
            </div>
          </div>
          <div class="project-title">nurdit logo animation</div>
        </div>

        <div class="project-item">
  <div class="box">
    <div class="video-container">
      <iframe 
        src="https://www.youtube.com/embed/uS1-Km2wDNM?autoplay=1&mute=1&controls=0&loop=1&playlist=uS1-Km2wDNM&rel=0&modestbranding=1&start=1" 
        frameborder="0" 
        allow="autoplay; encrypted-media; fullscreen" 
        style="position:absolute;top:0;left:0;width:100%;height:100%;">    
      </iframe>
      
    </div>
  </div>
  <div class="project-title">chocolate commercial shot on s25</div>
</div>

        <div class="project-item">
          <div class="box">Project 3</div>
          <div class="project-title">Film Title Here</div>
        </div>

        <div class="project-item">
          <div class="box">Project 4</div>
          <div class="project-title">Film Title Here</div>
        </div>

      </div>
    </div>

    <div id="photo-section" class="content-section">
      <div class="grid">
        
        <div class="project-item">
          <div class="box">Photo Project 1</div>
          <div class="project-title">Street Photography</div>
        </div>

        <div class="project-item">
          <div class="box">Photo Project 2</div>
          <div class="project-title">Portraits</div>
        </div>

      </div>
    </div>

  </section>

  <script>
    function showSection(sectionId, tabId) {
      // 1. Hide all sections
      const sections = document.querySelectorAll('.content-section');
      sections.forEach(s => s.classList.remove('active'));

      // 2. Remove active styling from all tab buttons
      const tabs = document.querySelectorAll('.tabs span');
      tabs.forEach(t => t.classList.remove('active'));

      // 3. Show the selected section and highlight the clicked tab
      document.getElementById(sectionId).classList.add('active');
      document.getElementById(tabId).classList.add('active');
    }
  </script>

</body>
</html>
