<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="favicon-16x16.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Works — Athul Sidheeque</title>

  <style>
    body {
      margin: 0;
      background: #0e0e0e;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    nav {
      position: fixed;
      top: 30px;
      right: 40px;
      z-index: 1000;
    }

    nav a {
      color: #ffffff;
      text-decoration: none;
      margin-left: 20px;
      font-size: 14px;
      opacity: 0.7;
      transition: opacity 0.3s;
    }

    nav a:hover {
      opacity: 1;
    }

    section {
      padding: 120px 10%;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 20px;
    }

    /* Tabs (Visual only for now) */
    .tabs {
      margin-bottom: 40px;
    }

    .tabs span {
      margin-right: 20px;
      font-size: 14px;
      opacity: 0.6;
      cursor: pointer;
      border-bottom: 1px solid transparent;
      padding-bottom: 5px;
    }

    .tabs span:hover {
      opacity: 1;
      border-bottom: 1px solid #fff; /* Adds a little underline effect */
    }

    .grid {
      display: grid;
      /* This makes it responsive automatically */
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .box {
      background: #1a1a1a;
      aspect-ratio: 16 / 9; /* Ensures boxes stay rectangular like video screens */
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      opacity: 0.5;
      color: #fff;
      text-decoration: none;
      transition: opacity 0.3s;
    }
    
    .box:hover {
      opacity: 1;
      background: #252525;
    }
    
    /* Use this class when you add real images */
    .project-img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* Ensures image covers the box without stretching */
    }
  </style>
</head>

<body>

  <nav>
    <a href="index.html">About</a>
    <a href="works.html">Works</a>
    <a href="contact.html">Contact</a>
  </nav>

  <section>
    <h1>Works</h1>

    <div class="tabs">
      <span>Photos</span>
      <span>Videos</span>
    </div>

    <div class="grid">
      <div class="video-container">
  <iframe title="vimeo-player" src="https://player.vimeo.com/video/928421563?h=6bd4eea842" width="640" height="360" frameborder="0" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share"   allowfullscreen></iframe> </div>
      
      <div class="box">Project 2</div>
      <div class="box">Project 3</div>
      <div class="box">Project 4</div>
    </div>
  </section>

</body>
</html>
