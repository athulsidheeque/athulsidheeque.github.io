<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="favicon-16x16.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Works — Athul Sidheeque</title>

<style>
    body {
      margin: 0;
      background: #0e0e0e;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    nav {
      position: fixed;
      top: 30px;
      right: 40px;
      z-index: 1000;
    }

    nav a {
      color: #ffffff;
      text-decoration: none;
      margin-left: 20px;
      font-size: 14px;
      opacity: 0.7;
      transition: opacity 0.3s;
    }

    nav a:hover {
      opacity: 1;
    }

    section {
      padding: 120px 10%;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 20px;
    }

    /* Tabs */
    .tabs {
      margin-bottom: 40px;
    }

    .tabs span {
      margin-right: 20px;
      font-size: 14px;
      opacity: 0.6;
      cursor: pointer;
      border-bottom: 1px solid transparent;
      padding-bottom: 5px;
    }

    .tabs span:hover {
      opacity: 1;
      border-bottom: 1px solid #fff;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .box {
      background: #1a1a1a;
      aspect-ratio: 16 / 9; 
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: #fff;
      text-decoration: none;
      transition: background 0.3s;
      position: relative; /* Added this to help the video position itself */
      overflow: hidden;   /* Ensures nothing leaks outside the corners */
    }
    
    /* Removed opacity: 0.5 from .box so your video isn't see-through! */
    
    .box:hover {
      background: #252525;
    }

    /* NEW: Vimeo Video Styles */
    .video-container {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .video-container iframe {
      width: 100%;
      height: 100%;
    }

    .project-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

  /* Add this to your existing <style> section */

.project-item {
  display: flex;
  flex-direction: column;
  text-decoration: none; /* Removes underline from links */
}

.project-title {
  margin-top: 12px;
  font-size: 11px; /* Slightly smaller looks more "designer" */
  letter-spacing: 2px;
  text-transform: uppercase;
  opacity: 0.6;
  color: #fff;
  font-weight: 300;
}
</style>
  
</head>

<body>

  <nav>
    <a href="index.html">About</a>
    <a href="works.html">Works</a>
    <a href="contact.html">Contact</a>
  </nav>

  <section>
    <h1>Works</h1>

    <div class="tabs">
      <span>Photos</span>
      <span>Videos</span>
    </div>
<div class="grid">
  
  <div class="project-item">
    <div class="box">
      <div class="video-container">
        <iframe src="https://player.vimeo.com/video/928421563?h=6bd4eea842&autoplay=1&muted=1&background=1" 
                frameborder="0" allow="autoplay; fullscreen" 
                style="position:absolute;top:0;left:0;width:100%;height:100%;">
        </iframe>
      </div>
    </div>
    <div class="project-title">Showreel 2024</div>
  </div>

  <div class="project-item">
    <div class="box">Project 2</div>
    <div class="project-title">Film Title Here</div>
  </div>

  <div class="project-item">
    <div class="box">Project 3</div>
    <div class="project-title">Photography Series</div>
  </div>

</div>
  </section>

</body>
</html>
