<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Athul Sidheeque</title>
  <style>
    :root {
      --accent-red: #f70202;
    }
    
    body, html {
      margin: 0;
      padding: 0;
      background: #050505;
      color: white;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    /* Cinematic Grain */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: url('https://grainy-gradients.vercel.app/noise.svg');
      opacity: 0.05;
      pointer-events: none;
      z-index: 999;
    }

    /* Hero Section */
    #hero {
      position: relative;
      height: 100vh;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      transition: background 0.5s ease;
    }

    /* The Name */
    .hero-name {
      position: relative;
      font-size: 8vw;
      font-weight: 900;
      letter-spacing: -2px;
      text-transform: none; /* Controlled by JS/Hover */
      z-index: 10;
      pointer-events: auto;
      transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
      cursor: crosshair;
    }

    /* Hover State - Minh Pham Style */
    #hero.active {
      background: var(--accent-red);
    }

    #hero.active .hero-name {
      color: black;
      font-family: 'Guisol', 'Impact', sans-serif; /* Fallback to Impact if Guisol isn't loaded */
      text-transform: lowercase;
      transform: scale(1.05);
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 5;
    }

    /* Scroll for About Section */
    #about-section {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050505;
    }

    /* Keep your existing .text-wrapper styles here */
  </style>
</head>
<body>

  <section id="hero">
    <canvas id="particleCanvas"></canvas>
    <div class="hero-name" id="nameTrigger">Athul Sidheeque</div>
  </section>

  <section id="about-section">
    </section>

  <script>
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    const hero = document.getElementById('hero');
    const nameTrigger = document.getElementById('nameTrigger');

    let particles = [];
    let mouse = { x: 0, y: 0, radius: 100 };
    let isActive = false;

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // Interaction Trigger
    nameTrigger.addEventListener('mouseenter', () => {
      isActive = true;
      hero.classList.add('active');
    });

    nameTrigger.addEventListener('mouseleave', () => {
      isActive = false;
      hero.classList.remove('active');
    });

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    class Particle {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.baseX = x;
        this.baseY = y;
        this.size = Math.random() * 2 + 1;
        this.density = (Math.random() * 30) + 1;
      }

      draw() {
        ctx.fillStyle = isActive ? 'black' : 'white';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.closePath();
        ctx.fill();
      }

      update() {
        let dx = mouse.x - this.x;
        let dy = mouse.y - this.y;
        let distance = Math.sqrt(dx * dx + dy * dy);
        let forceDirectionX = dx / distance;
        let forceDirectionY = dy / distance;
        let maxDistance = mouse.radius;
        let force = (maxDistance - distance) / maxDistance;
        let directionX = forceDirectionX * force * this.density;
        let directionY = forceDirectionY * force * this.density;

        if (distance < mouse.radius) {
          this.x -= directionX;
          this.y -= directionY;
        } else {
          if (this.x !== this.baseX) {
            let dx = this.x - this.baseX;
            this.x -= dx / 10;
          }
          if (this.y !== this.baseY) {
            let dy = this.y - this.baseY;
            this.y -= dy / 10;
          }
        }
      }
    }

    function init() {
      particles = [];
      // This creates a simple noise grid around the center
      // For high-end "text-shaped" particles, we would use ctx.getImageData
      for (let i = 0; i < 500; i++) {
        let x = (Math.random() * 400) + (canvas.width/2 - 200);
        let y = (Math.random() * 200) + (canvas.height/2 - 100);
        particles.push(new Particle(x, y));
      }
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < particles.length; i++) {
        particles[i].draw();
        particles[i].update();
      }
      requestAnimationFrame(animate);
    }

    init();
    animate();

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      init();
    });
  </script>
</body>
</html>
