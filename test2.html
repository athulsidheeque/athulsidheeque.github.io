<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Athul Sidheeque</title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent-red: #f70202;
            --accent-green: #c3ff00;
        }

        body {
            margin: 0;
            background: #050505;
            font-family: Arial, Helvetica, sans-serif;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* 3. ROLLING NAV (Centered & Tighter) */
        nav {
            position: fixed;
            top: 40px;
            right: 40px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center; /* Centered within the space */
            gap: 8px; /* Decreased line spacing */
        }

        .nav-item {
            height: 18px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            text-align: center;
        }

        .nav-link {
            display: block;
            font-size: 13px; /* Decreased font size */
            font-weight: 600;
            line-height: 18px;
            color: #fff;
            text-decoration: none;
            text-transform: uppercase;
            transition: transform 0.5s cubic-bezier(0.76, 0, 0.24, 1);
        }

        /* Rolling Effect */
        .nav-item:hover .nav-link {
            transform: translateY(-100%);
        }

        .nav-item::after {
            content: attr(data-text);
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            font-size: 13px;
            font-weight: 600;
            line-height: 18px;
            text-transform: uppercase;
            color: var(--accent-red);
            transition: transform 0.5s cubic-bezier(0.76, 0, 0.24, 1);
        }

        .nav-item:hover::after {
            transform: translateY(-100%);
        }

        /* 1. HERO REVEAL (Dual Color) */
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .hero-container {
            position: relative;
            cursor: none;
        }

        .hero-text {
            font-size: 10vw;
            line-height: 0.9;
            font-weight: 500;
            text-transform: lowercase;
            margin: 0;
            color: #fff;
            position: relative;
            z-index: 1;
        }

        .reveal-circle {
            position: fixed;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0);
            transition: transform 0.3s ease, background-color 0.3s ease;
            z-index: 2;
            mix-blend-mode: difference; /* This handles the black text effect */
            background-color: white; /* Base */
        }

        .hero-container:hover .reveal-circle {
            transform: translate(-50%, -50%) scale(1);
        }

        /* 2. SOUND TOGGLE (Side-by-Side) */
        .sound-ui {
            position: fixed;
            bottom: 30px;
            right: 30px;
            font-size: 11px;
            letter-spacing: 0.2em;
            cursor: pointer;
            z-index: 1000;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        #sound-state {
            font-weight: bold;
            transition: color 0.3s;
        }
        #sound-state.on { color: var(--accent-green); }
        #sound-state.off { color: var(--accent-red); }

        /* Socials (Corrected alignment) */
        .socials {
            position: fixed;
            left: 30px;
            bottom: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .social-icon {
            width: 24px;
            fill: #666;
            transition: fill 0.3s;
        }
        .social-icon:hover { fill: var(--accent-red); }

    </style>
</head>
<body>

    <nav>
        <div class="nav-item" data-text="About"><a href="#" class="nav-link">About</a></div>
        <div class="nav-item" data-text="Work"><a href="#" class="nav-link">Work</a></div>
        <div class="nav-item" data-text="Contact"><a href="#" class="nav-link">Contact</a></div>
    </nav>

    <div class="sound-ui" id="soundToggle">
        <span>SOUND</span>
        <span id="sound-state" class="off">OFF</span>
    </div>

    <section class="hero">
        <div class="hero-container" id="heroArea">
            <div class="reveal-circle" id="cursorCircle"></div>
            <h1 class="hero-text">
                <span id="name-athul">athul</span><br>
                <span id="name-sidheeque">sidheeque</span>
            </h1>
        </div>
    </section>

    <audio id="bgAudio" loop>
        <source src="https://raw.githubusercontent.com/athulsidheeque/athulsidheeque.github.io/74a392a75b583daf072494b303fc376a161a9521/web%20audio.mp3" type="audio/mpeg">
    </audio>

    <script>
        const circle = document.getElementById('cursorCircle');
        const heroArea = document.getElementById('heroArea');
        const athul = document.getElementById('name-athul');
        const sidheeque = document.getElementById('name-sidheeque');

        // Hero Reveal Color Logic
        document.addEventListener('mousemove', (e) => {
            circle.style.left = e.clientX + 'px';
            circle.style.top = e.clientY + 'px';
            
            const rectAthul = athul.getBoundingClientRect();
            const rectSid = sidheeque.getBoundingClientRect();

            // Check which name the cursor is closer to
            if (e.clientY < rectSid.top) {
                circle.style.backgroundColor = '#f70202'; // Red for Athul
            } else {
                circle.style.backgroundColor = '#c3ff00'; // Green for Sidheeque
            }
        });

        // Sound Logic
        const soundToggle = document.getElementById('soundToggle');
        const soundState = document.getElementById('sound-state');
        const audio = document.getElementById('bgAudio');
        let playing = false;

        soundToggle.addEventListener('click', () => {
            if (!playing) {
                audio.play();
                soundState.innerText = "ON";
                soundState.className = "on";
            } else {
                audio.pause();
                soundState.innerText = "OFF";
                soundState.className = "off";
            }
            playing = !playing;
        });
    </script>
</body>
</html>
