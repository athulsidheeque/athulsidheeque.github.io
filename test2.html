<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="favicon-16x16.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Athul Sidheeque</title>
  
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap" rel="stylesheet">

  <style>
    body, html {
      margin: 0;
      padding: 0;
      background: #050505;
      overflow-x: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* Grainy Texture */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: url('https://grainy-gradients.vercel.app/noise.svg');
      opacity: 0.05;
      pointer-events: none;
      z-index: 1000;
    }

    .hero {
      position: relative;
      height: 100vh;
      width: 100%;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background 0.4s ease;
    }

    /* Hover State */
    .hero.active {
      background: #f70202; /* Your Red */
    }

    /* Hover Strip */
    .hover-strip {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 10px 24px;
      border: 1px solid #333;
      color: #888;
      cursor: pointer;
      z-index: 10;
      transition: all 0.3s ease;
    }

    .hover-strip:hover {
      background: #f70202;
      color: #000;
      border-color: #000;
      font-family: 'DM Serif Display', serif;
      text-transform: lowercase;
      letter-spacing: 0px;
      font-size: 18px;
    }

    /* Main Name Display */
    .hero-name {
      position: absolute;
      font-size: 7vw;
      font-weight: 900;
      color: white;
      z-index: 3;
      pointer-events: none;
      transition: all 0.3s ease;
      text-align: center;
    }

    .hero.active .hero-name {
      color: #000;
      font-family: 'DM Serif Display', serif;
      text-transform: lowercase;
      font-size: 8vw;
    }

    canvas {
      position: absolute;
      inset: 0;
      z-index: 2;
    }
  </style>
</head>
<body>

  <div class="hero" id="hero">
    <div class="hover-strip" id="hoverStrip">making good shit since</div>
    <canvas id="particleCanvas"></canvas>
    <h1 class="hero-name" id="heroName">Athul Sidheeque</h1>
  </div>

  <script>
    const canvas = document.getElementById("particleCanvas");
    const ctx = canvas.getContext("2d");
    const hero = document.getElementById("hero");
    const hoverStrip = document.getElementById("hoverStrip");

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let particles = [];
    let mouse = { x: -1000, y: -1000 };
    let isHovering = false;

    window.addEventListener("mousemove", (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    hoverStrip.addEventListener("mouseenter", () => {
      isHovering = true;
      hero.classList.add("active");
    });
    
    hoverStrip.addEventListener("mouseleave", () => {
      isHovering = false;
      hero.classList.remove("active");
    });

    // 1. Map Text to Coordinates
    function init() {
      const tCanvas = document.createElement("canvas");
      const tCtx = tCanvas.getContext("2d");
      tCanvas.width = canvas.width;
      tCanvas.height = canvas.height;

      tCtx.fillStyle = "white";
      tCtx.font = "bold 130px Arial"; // Matches the base look
      tCtx.textAlign = "center";
      tCtx.textBaseline = "middle";
      tCtx.fillText("ATHUL SIDHEEQUE", tCanvas.width / 2, tCanvas.height / 2);

      const data = tCtx.getImageData(0, 0, tCanvas.width, tCanvas.height);
      particles = [];

      // Scan pixels (gap of 6 for noise effect)
      for (let y = 0; y < tCanvas.height; y += 6) {
        for (let x = 0; x < tCanvas.width; x += 6) {
          const index = (y * tCanvas.width + x) * 4;
          if (data.data[index + 3] > 128) {
            particles.push({
              x: Math.random() * canvas.width, // Start scattered
              y: Math.random() * canvas.height,
              baseX: x,
              baseY: y,
              vx: 0,
              vy: 0,
              size: Math.random() * 2 + 1
            });
          }
        }
      }
    }

    // 2. Animate
    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      particles.forEach(p => {
        let dx = mouse.x - p.x;
        let dy = mouse.y - p.y;
        let dist = Math.sqrt(dx * dx + dy * dy);
        let forceRadius = 120;

        if (dist < forceRadius) {
          let force = (forceRadius - dist) / forceRadius;
          let angle = Math.atan2(dy, dx);
          p.vx -= Math.cos(angle) * force * 4;
          p.vy -= Math.sin(angle) * force * 4;
        }

        // Physics: Return to origin + Damping
        p.vx += (p.baseX - p.x) * 0.03;
        p.vy += (p.baseY - p.y) * 0.03;
        p.vx *= 0.92;
        p.vy *= 0.92;

        p.x += p.vx;
        p.y += p.vy;

        // Visual Inversion
        ctx.fillStyle = isHovering 
          ? "rgba(0,0,0,0.85)" 
          : "rgba(195,255,0,0.8)"; // Your signature lime color
        
        ctx.fillRect(p.x, p.y, p.size, p.size);
      });

      requestAnimationFrame(animate);
    }

    window.addEventListener("resize", () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      init();
    });

    init();
    animate();
  </script>
</body>
</html>
