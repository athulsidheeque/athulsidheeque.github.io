<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="favicon-16x16.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Athul Sidheeque</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      background: #050505;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    /* Cinematic Film Grain Overlay */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: url('https://grainy-gradients.vercel.app/noise.svg');
      opacity: 0.05;
      pointer-events: none;
      z-index: 1000;
    }

    #hero {
      position: relative;
      height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .hero-name {
      position: relative;
      font-size: 24px;
      font-weight: 400;
      letter-spacing: 0.08em;
      opacity: 0.85;
      z-index: 10;
      pointer-events: none;
      text-transform: lowercase;
    }

    /* Magnetic Nav Container */
    .nav-container {
      position: absolute;
      bottom: 40px;
      display: flex;
      gap: 30px;
      z-index: 20;
    }

    .nav-item {
      position: relative;
      width: 60px;
      height: 60px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .reveal-circle {
      position: absolute;
      width: 45px;
      height: 45px;
      background: #f70202;
      border-radius: 50%;
      transform: scale(0);
      transition: transform 0.4s cubic-bezier(0.19, 1, 0.22, 1);
      z-index: 1;
      pointer-events: none;
    }

    .icon {
      position: relative;
      z-index: 2;
      width: 20px;
      height: 20px;
      fill: #555;
      transition: fill 0.3s ease;
    }

    .nav-item:hover .reveal-circle { transform: scale(1); }
    .nav-item:hover .icon { fill: #000; }

    canvas {
      position: absolute;
      inset: 0;
      z-index: 5;
    }
  </style>
</head>
<body>

  <section id="hero">
    <canvas id="particleCanvas"></canvas>
    
    <div class="hero-name">athul sidheeque</div>

    <div class="nav-container">
      <div class="nav-item magnetic">
        <div class="reveal-circle"></div>
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.058-1.69-.072-4.949-.072zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
      </div>
    </div>
  </section>

  <script>
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let particles = [];
    let mouse = { x: -1000, y: -1000, radius: 120 };

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.vx = (Math.random() - 0.5) * 0.3;
        this.vy = (Math.random() - 0.5) * 0.3;
        this.size = Math.random() * 1.8 + 0.5;
      }

      draw() {
        ctx.globalAlpha = 0.8;
        ctx.shadowBlur = 12;
        ctx.shadowColor = "rgba(195,255,0,0.4)";
        ctx.fillStyle = "rgba(195,255,0,0.8)";
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;

        if (this.x < 0) this.x = canvas.width;
        if (this.x > canvas.width) this.x = 0;
        if (this.y < 0) this.y = canvas.height;
        if (this.y > canvas.height) this.y = 0;

        let dx = mouse.x - this.x;
        let dy = mouse.y - this.y;
        let distance = Math.sqrt(dx * dx + dy * dy);

        if (distance < mouse.radius) {
          let force = (mouse.radius - distance) / mouse.radius;
          this.x -= (dx / distance) * force * 2;
          this.y -= (dy / distance) * force * 2;
        }
      }
    }

    function init() {
      particles = [];
      const particleCount = 120; // High-end premium count
      for (let i = 0; i < particleCount; i++) {
        particles.push(new Particle());
      }
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animate);
    }

    // Magnetic logic for navigation items
    const magneticItems = document.querySelectorAll('.nav-item');
    magneticItems.forEach(item => {
      item.addEventListener('mousemove', (e) => {
        const rect = item.getBoundingClientRect();
        const x = e.clientX - rect.left - rect.width / 2;
        const y = e.clientY - rect.top - rect.height / 2;
        const icon = item.querySelector('.icon');
        const circle = item.querySelector('.reveal-circle');
        
        icon.style.transform = `translate(${x * 0.3}px, ${y * 0.3}px)`;
        circle.style.transform = `translate(${x * 0.5}px, ${y * 0.5}px) scale(1)`;
      });

      item.addEventListener('mouseleave', (e) => {
        const icon = item.querySelector('.icon');
        const circle = item.querySelector('.reveal-circle');
        icon.style.transform = `translate(0, 0)`;
        circle.style.transform = `translate(0, 0) scale(0)`;
      });
    });

    init();
    animate();
    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      init();
    });
  </script>
</body>
</html>
