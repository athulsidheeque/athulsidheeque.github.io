<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="favicon-16x16.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Athul Sidheeque</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">

  <style>
    body, html {
      margin: 0;
      padding: 0;
      background: #050505;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    /* Film Grain Overlay */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: url('https://grainy-gradients.vercel.app/noise.svg');
      opacity: 0.05;
      pointer-events: none;
      z-index: 1000;
    }

    #hero {
      position: relative;
      height: 100vh;
      width: 100%;
      overflow: hidden;
    }

    /* Small name trigger */
    .hero-name {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 28px;
      font-weight: 400;
      letter-spacing: 0.02em;
      z-index: 20;
      cursor: crosshair;
      transition: all 0.3s ease;
      text-transform: lowercase;
    }

    /* Radial Circle effect */
    .hover-circle {
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, #f70202 50%, transparent 100%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      z-index: 10;
      transition: transform 0.5s cubic-bezier(0.19, 1, 0.22, 1);
      pointer-events: none;
    }

    /* Active States */
    #hero.active .hover-circle {
      transform: translate(-50%, -50%) scale(1);
    }

    #hero.active .hero-name {
      color: #000;
      font-weight: 600;
    }

    canvas {
      position: absolute;
      inset: 0;
      z-index: 5;
    }
  </style>
</head>
<body>

  <section id="hero">
    <canvas id="particleCanvas"></canvas>
    <div class="hover-circle" id="hoverCircle"></div>
    <div class="hero-name" id="nameTrigger">athul sidheeque</div>
  </section>

  <script>
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const hero = document.getElementById('hero');
    const nameTrigger = document.getElementById('nameTrigger');

    let particles = [];
    let mouse = { x: -1000, y: -1000, radius: 120 };
    let isActive = false;

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    nameTrigger.addEventListener('mouseenter', () => {
      isActive = true;
      hero.classList.add('active');
    });

    nameTrigger.addEventListener('mouseleave', () => {
      isActive = false;
      hero.classList.remove('active');
    });

    class Particle {
      constructor(x, y) {
        this.x = x + (Math.random() * 10 - 5);
        this.y = y + (Math.random() * 10 - 5);
        this.baseX = x;
        this.baseY = y;
        this.size = Math.random() * 2 + 0.5;
        this.density = (Math.random() * 20) + 10;
      }

      draw() {
        // Spotlight Glow Logic
        ctx.shadowBlur = isActive ? 0 : 8;
        ctx.shadowColor = "rgba(255,255,255,0.2)";
        
        ctx.fillStyle = isActive 
          ? 'rgba(0,0,0,0.95)' 
          : 'rgba(255,255,255,0.7)';
          
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }

      update() {
        let dx = mouse.x - this.x;
        let dy = mouse.y - this.y;
        let distance = Math.sqrt(dx * dx + dy * dy);
        
        if (distance < mouse.radius) {
          let force = (mouse.radius - distance) / mouse.radius;
          let directionX = (dx / distance) * force * this.density;
          let directionY = (dy / distance) * force * this.density;
          this.x -= directionX;
          this.y -= directionY;
        } else {
          this.x += (this.baseX - this.x) * 0.1;
          this.y += (this.baseY - this.y) * 0.1;
        }
      }
    }

    function init() {
      particles = [];
      ctx.fillStyle = 'white';
      ctx.font = '900 18vw "Archivo Black"';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('ATHUL', canvas.width / 2, canvas.height / 2);
      
      const pixels = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let y = 0; y < canvas.height; y += 5) {
        for (let x = 0; x < canvas.width; x += 5) {
          const index = (y * canvas.width + x) * 4;
          if (pixels[index + 3] > 128) {
            particles.push(new Particle(x, y));
          }
        }
      }
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < particles.length; i++) {
        particles[i].draw();
        particles[i].update();
      }
      requestAnimationFrame(animate);
    }

    init();
    animate();

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      init();
    });
  </script>
</body>
</html>
