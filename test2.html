<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="favicon-16x16.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Athul Sidheeque</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">

  <style>
    :root {
      --accent-red: #f70202;
    }

    body, html {
      margin: 0;
      padding: 0;
      background: #050505;
      color: white;
      font-family: 'Helvetica', Arial, sans-serif;
      overflow-x: hidden;
    }

    /* Cinematic Film Grain */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: url('https://grainy-gradients.vercel.app/noise.svg');
      opacity: 0.05;
      pointer-events: none;
      z-index: 1000;
    }

    #hero {
      position: relative;
      height: 100vh;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background 0.4s cubic-bezier(0.19, 1, 0.22, 1);
      z-index: 2;
    }

    /* Minh Pham Style Inversion */
    #hero.active {
      background: var(--accent-red);
    }

    .hero-name {
      position: relative;
      font-size: 8.5vw;
      font-weight: 900;
      z-index: 10;
      pointer-events: auto;
      transition: all 0.3s ease;
      cursor: crosshair;
      color: white;
      font-family: 'Archivo Black', sans-serif;
      letter-spacing: -0.02em;
    }

    #hero.active .hero-name {
      color: #000;
      text-transform: lowercase;
      letter-spacing: -0.05em;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 5;
    }

    #about-content {
      position: relative;
      z-index: 10;
      background: #050505;
    }
  </style>
</head>
<body>

  <section id="hero">
    <canvas id="particleCanvas"></canvas>
    <div class="hero-name" id="nameTrigger">Athul Sidheeque</div>
  </section>

  <div id="about-content"></div>

  <script>
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const hero = document.getElementById('hero');
    const nameTrigger = document.getElementById('nameTrigger');

    let particles = [];
    let mouse = { x: -1000, y: -1000, radius: 90 };
    let isActive = false;

    function setCanvasSize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    nameTrigger.addEventListener('mouseenter', () => {
      isActive = true;
      hero.classList.add('active');
    });

    nameTrigger.addEventListener('mouseleave', () => {
      isActive = false;
      hero.classList.remove('active');
    });

    class Particle {
      constructor(x, y) {
        this.x = x + (Math.random() * 20 - 10);
        this.y = y + (Math.random() * 20 - 10);
        this.baseX = x;
        this.baseY = y;
        this.size = Math.random() * 1.5 + 0.5;
        this.density = (Math.random() * 25) + 5;
      }

      draw() {
        ctx.fillStyle = isActive ? 'rgba(0,0,0,0.9)' : 'rgba(255,255,255,0.7)';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }

      update() {
        let dx = mouse.x - this.x;
        let dy = mouse.y - this.y;
        let distance = Math.sqrt(dx * dx + dy * dy);
        
        if (distance < mouse.radius) {
          let force = (mouse.radius - distance) / mouse.radius;
          let directionX = (dx / distance) * force * this.density;
          let directionY = (dy / distance) * force * this.density;
          
          this.x -= directionX;
          this.y -= directionY;
        } else {
          this.x += (this.baseX - this.x) * 0.08;
          this.y += (this.baseY - this.y) * 0.08;
        }
      }
    }

    function init() {
      setCanvasSize();
      particles = [];
      
      // Temporary render to capture pixel data
      ctx.fillStyle = 'white';
      ctx.font = '900 8.5vw "Archivo Black"';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('Athul Sidheeque', canvas.width / 2, canvas.height / 2);
      
      const pixels = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Scan and create particles (Gap adjustment for density)
      for (let y = 0; y < canvas.height; y += 4) {
        for (let x = 0; x < canvas.width; x += 4) {
          const index = (y * canvas.width + x) * 4;
          if (pixels[index + 3] > 128) { // If pixel alpha is visible
            particles.push(new Particle(x, y));
          }
        }
      }
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < particles.length; i++) {
        particles[i].draw();
        particles[i].update();
      }
      requestAnimationFrame(animate);
    }

    // Delay init slightly to ensure font is loaded
    window.onload = () => {
        init();
        animate();
    };

    window.addEventListener('resize', () => {
      init();
    });
  </script>
</body>
</html>
