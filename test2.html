<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Athul Sidheeque</title>

<style>
body {
  margin: 0;
  background: #050505;
  font-family: Arial, Helvetica, sans-serif;
  color: #fff;
  overflow-x: hidden;
}

/* FILM GRAIN */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  background: url('https://grainy-gradients.vercel.app/noise.svg');
  opacity: 0.05;
  pointer-events: none;
  z-index: 2000;
}

/* NAV */
nav {
  position: fixed;
  top: 30px;
  right: 40px;
  z-index: 1000;
}
nav a {
  display: block;
  color: #fff;
  text-decoration: none;
  font-size: 12px;
  opacity: 0.6;
  margin-bottom: 10px;
}

/* HERO */
.hero {
  height: 100vh;
  display: flex;
  align-items: center;
  padding-left: 12vw;
}

.hero-title {
  font-size: 9.5vw;
  line-height: 0.85;
  font-weight: 500;
  letter-spacing: -0.04em;
  color: #eaeaea;
}

/* SOCIAL (LEFT) */
.socials {
  position: fixed;
  left: 30px;
  bottom: 40px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  z-index: 1000;
}

.nav-item {
  position: relative;
  width: 45px;
  height: 45px;
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: pointer;
}

.reveal {
  position: absolute;
  width: 38px;
  height: 38px;
  background: #f70202;
  border-radius: 50%;
  transform: scale(0);
  transition: 0.4s cubic-bezier(0.19,1,0.22,1);
}

.icon {
  width: 18px;
  height: 18px;
  fill: #aaa;
  z-index: 2;
  transition: 0.3s;
}

.nav-item:hover .reveal {
  transform: scale(1);
}

.nav-item:hover .icon {
  fill: #000;
}

/* SOUND */
.sound {
  position: fixed;
  right: 30px;
  bottom: 50%;
  transform: translateY(50%) rotate(-90deg);
  font-size: 12px;
  letter-spacing: 2px;
  opacity: 0.6;
}

/* ABOUT */
.about {
  min-height: 100vh;
  display: flex;
  align-items: flex-start;
  padding-top: 120px;
  padding-left: 12vw;
  padding-right: 12vw;
}

.text-wrapper {
  position: relative;
  max-width: 720px;
}

.text {
  font-size: 22px;
  line-height: 1.7;
  font-weight: 500;
}

/* FIRST LINE VISIBLE */
.base {
  color: #888;
}

/* GLOW */
.glow {
  position: absolute;
  inset: 0;
  color: #c3ff00;
  pointer-events: none;

  -webkit-mask-image: radial-gradient(circle 0px at 0 0, white, transparent);
  mask-image: radial-gradient(circle 0px at 0 0, white, transparent);

  text-shadow:
    0 0 10px rgba(195,255,0,0.8),
    0 0 30px rgba(195,255,0,0.5);
}

/* RED */
.glow .highlight {
  color: #f70202;
}

</style>
</head>

<body>

<nav>
  <a href="#">ABOUT</a>
  <a href="#">WORK</a>
  <a href="#">CONTACT</a>
</nav>

<!-- SOCIAL ICONS -->
<div class="socials">

  <!-- INSTAGRAM -->
  <div class="nav-item">
    <div class="reveal"></div>
    <svg class="icon" viewBox="0 0 24 24">
      <path d="M12 2.16c3.2 0 3.6.01 4.8.07 3.2.15 4.7 1.7 4.9 4.9.06 1.2.07 1.6.07 4.8s-.01 3.6-.07 4.8c-.15 3.2-1.7 4.7-4.9 4.9-1.2.06-1.6.07-4.8.07s-3.6-.01-4.8-.07c-3.2-.15-4.7-1.7-4.9-4.9C2.17 15.6 2.16 15.2 2.16 12s.01-3.6.07-4.8c.15-3.2 1.7-4.7 4.9-4.9 1.2-.06 1.6-.07 4.8-.07zm0 5.8A6.2 6.2 0 1012 20a6.2 6.2 0 000-12.04zm0 10.04A3.8 3.8 0 1112 10a3.8 3.8 0 010 8z"/>
    </svg>
  </div>

  <!-- LINKEDIN -->
  <div class="nav-item">
    <div class="reveal"></div>
    <svg class="icon" viewBox="0 0 24 24">
      <path d="M4 3a2 2 0 110 4 2 2 0 010-4zm1 5H3v13h2V8zm7 0h-2v13h2v-7c0-4 5-4 5 0v7h2v-8c0-6-7-5-7-1V8z"/>
    </svg>
  </div>

  <!-- YOUTUBE -->
  <div class="nav-item">
    <div class="reveal"></div>
    <svg class="icon" viewBox="0 0 24 24">
      <path d="M23 7s-.2-1.4-.8-2c-.7-.8-1.5-.8-1.9-.9C17.7 4 12 4 12 4s-5.7 0-8.3.1c-.4.1-1.2.1-1.9.9C1.2 5.6 1 7 1 7S1 8.6 1 10.3v1.4C1 13.4 1 15 1 15s.2 1.4.8 2c.7.8 1.7.8 2.1.9 1.6.1 8.1.1 8.1.1s5.7 0 8.3-.1c.4-.1 1.2-.1 1.9-.9.6-.6.8-2 .8-2s0-1.6 0-3.3v-1.4C23 8.6 23 7 23 7zM10 14V8l6 3-6 3z"/>
    </svg>
  </div>

</div>

<div class="sound">SOUND ON</div>

<!-- HERO -->
<section class="hero">
  <h1 class="hero-title">
    athul<br>sidheeque
  </h1>
</section>

<!-- ABOUT -->
<section class="about">
  <div class="text-wrapper">
    
    <div class="text base" id="baseText">
      I spend my days (and a lot of my nights) exploring stories through my passion to create. I love the journey of becoming better, taking what I learn and turning it into something special. Nothing matters as much as the <span class="highlight">soul</span> of the project.
    </div>

    <div class="text glow" id="glowText"></div>

  </div>
</section>

<script>
// COPY TEXT
const base = document.getElementById("baseText");
const glow = document.getElementById("glowText");
glow.innerHTML = base.innerHTML;

// SMOOTH GLOW
let x=0,y=0,tx=0,ty=0;

window.addEventListener("mousemove", e=>{
  tx=e.clientX;
  ty=e.clientY;
});

function animate(){
  x+=(tx-x)*0.08;
  y+=(ty-y)*0.08;

  const rect = glow.getBoundingClientRect();
  const mx = x - rect.left;
  const my = y - rect.top;

  glow.style.webkitMaskImage =
    `radial-gradient(circle 160px at ${mx}px ${my}px, white 0%, transparent 70%)`;

  requestAnimationFrame(animate);
}
animate();

// MAGNETIC
document.querySelectorAll(".nav-item").forEach(item=>{
  item.addEventListener("mousemove", e=>{
    const rect = item.getBoundingClientRect();
    const x = e.clientX - rect.left - rect.width/2;
    const y = e.clientY - rect.top - rect.height/2;

    item.style.transform = `translate(${x*0.3}px, ${y*0.3}px)`;
  });

  item.addEventListener("mouseleave", ()=>{
    item.style.transform = `translate(0,0)`;
  });
});
</script>

</body>
</html>
