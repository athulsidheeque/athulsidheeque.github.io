<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="favicon-16x16.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Athul Sidheeque</title>

  <style>
    body {
      margin: 0;
      background: #0b0b0b; /* Slightly deeper black */
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    nav {
      position: fixed;
      top: 40px;
      right: 50px;
      z-index: 1000;
    }

    nav a {
      color: #ffffff;
      text-decoration: none;
      margin-left: 30px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
      opacity: 0.5;
      transition: opacity 0.4s;
    }

    nav a:hover { opacity: 1; }

    section { 
      padding: 150px 8% 100px 8%; 
      max-width: 1200px;
    }

    /* MASSIVE TYPOGRAPHY */
    h1 {
      font-size: clamp(3rem, 10vw, 8rem); /* Scales with screen size */
      line-height: 0.9;
      margin-bottom: 60px;
      letter-spacing: -2px;
      font-weight: bold;
    }

    .contact-layout {
      display: flex;
      flex-direction: column;
      gap: 100px;
    }

    /* FORM STYLING - Borderless & Raw */
    .contact-form {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 600px;
    }

    .contact-form input, 
    .contact-form textarea {
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255,255,255,0.2);
      color: white;
      padding: 25px 0;
      font-family: inherit;
      font-size: 18px;
      outline: none;
      transition: border-color 0.4s;
    }

    .contact-form input:focus, 
    .contact-form textarea:focus {
      border-bottom-color: #ffffff;
    }

    .contact-form button {
      margin-top: 40px;
      background: #ffffff;
      color: #000;
      border: none;
      padding: 20px 40px;
      width: fit-content;
      cursor: pointer;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 12px;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .contact-form button:hover {
      transform: scale(1.05);
    }

    /* MINI GRID FOR LINKS */
    .link-grid {
      display: flex;
      gap: 60px;
      flex-wrap: wrap;
    }

    .link-item {
      text-decoration: none;
      color: white;
      transition: transform 0.3s;
    }

    .link-item span {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      opacity: 0.4;
      margin-bottom: 10px;
    }

    .link-item p {
      margin: 0;
      font-size: 24px;
      font-weight: 500;
    }

    .link-item:hover {
      transform: translateY(-5px);
    }

    @media (max-width: 600px) {
      section { padding-top: 100px; }
      h1 { font-size: 4rem; }
      .link-grid { gap: 30px; }
      .link-item p { font-size: 18px; }
    }
  </style>
</head>

<body>

  <nav>
    <a href="index.html">About</a>
    <a href="works.html">Works</a>
    <a href="contact.html">Contact</a>
  </nav>

  <section>
    <h1>Let's build<br>something real.</h1>

    <div class="contact-layout">
      <form action="https://formspree.io/f/mlglypjz" method="POST" class="contact-form">
        <input type="text" name="name" placeholder="Name" required>
        <input type="email" name="email" placeholder="Email Address" required>
        <textarea name="message" placeholder="Project details" required></textarea>
        <button type="submit">Send Message</button>
      </form>

      <div class="link-grid">
        <a href="https://instagram.com/athul_sidiq" target="_blank" class="link-item">
          <span>Instagram</span>
          <p>@athul_sidiq</p>
        </a>

        <a href="https://www.linkedin.com/in/athul-sidiq/" target="_blank" class="link-item">
          <span>LinkedIn</span>
          <p>Professional</p>
        </a>
      </div>
    </div>
  </section>

</body>
</html>
