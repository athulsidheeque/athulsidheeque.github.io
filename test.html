<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About — Athul Sidheeque</title>
  <style>
    body {
      margin: 0;
      background: #0a0a0a;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Keep your existing Nav style */
    nav {
      position: fixed;
      top: 30px;
      right: 40px;
      z-index: 1000;
    }

    nav a {
      color: #ffffff;
      text-decoration: none;
      margin-left: 20px;
      font-size: 14px;
      opacity: 0.7;
      transition: opacity 0.3s;
    }

    nav a:hover { opacity: 1; }

    .text-container {
      max-width: 800px;
      padding: 40px;
      font-size: 32px; /* Slightly larger for impact */
      line-height: 1.4;
      cursor: default;
      user-select: none;
    }

    .letter {
      display: inline-block;
      white-space: pre; /* Preserves spaces between words */
      transition: 
        transform 0.1s linear, 
        color 0.2s ease, 
        opacity 0.2s ease;
      opacity: 0.25;
      color: #555;
      will-change: transform, opacity; /* Improves performance */
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html">About</a>
    <a href="works.html">Works</a>
    <a href="contact.html">Contact</a>
  </nav>

  <div class="text-container" id="text">
    I learned design the hard way through curiosity that wouldn’t rest, 
    mistakes that wouldn’t be ignored, and iteration that wouldn’t stop.
  </div>

  <script>
    const container = document.getElementById("text");
    const textContent = container.innerText.trim();
    container.innerHTML = "";

    // Split into letters and preserve spaces
    [...textContent].forEach(char => {
      const span = document.createElement("span");
      span.classList.add("letter");
      span.innerText = char;
      container.appendChild(span);
    });

    const letters = document.querySelectorAll(".letter");

    container.addEventListener("mousemove", (e) => {
      const mouseX = e.clientX;
      const mouseY = e.clientY;

      letters.forEach(letter => {
        const lRect = letter.getBoundingClientRect();
        const lx = lRect.left + lRect.width / 2;
        const ly = lRect.top + lRect.height / 2;

        const dx = mouseX - lx;
        const dy = mouseY - ly;
        const distance = Math.sqrt(dx * dx + dy * dy);

        const maxDist = 150; // Radius of effect

        if (distance < maxDist) {
          const strength = (maxDist - distance) / maxDist;

          // Brightness & Color Shift
          letter.style.opacity = 0.25 + (strength * 0.75);
          letter.style.color = `hsl(${220 + strength * 40}, 100%, 80%)`; // Blue to Cyan shift

          // Magnetic Movement & Scale
          letter.style.transform = `
            translate(${dx * -0.1 * strength}px, ${dy * -0.1 * strength}px)
            scale(${1 + strength * 0.3})
          `;
        } else {
          letter.style.opacity = 0.25;
          letter.style.color = "#555";
          letter.style.transform = "translate(0px, 0px) scale(1)";
        }
      });
    });

    container.addEventListener("mouseleave", () => {
      letters.forEach(letter => {
        letter.style.opacity = 0.25;
        letter.style.color = "#555";
        letter.style.transform = "translate(0px, 0px) scale(1)";
      });
    });
  </script>
</body>
</html>
