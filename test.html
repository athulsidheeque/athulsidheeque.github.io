<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <title>Athul Sidheeque</title>

  <style>
    body {
      margin: 0;
      background: #0e0e0e;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    nav {
      position: fixed;
      top: 30px;
      right: 40px;
      z-index: 1000; /* Ensures nav stays on top of everything */
    }

    nav a {
      color: #ffffff;
      text-decoration: none;
      margin-left: 20px;
      font-size: 14px;
      opacity: 0.7;
      transition: opacity 0.3s ease; /* smooths the hover effect */
    }

    nav a:hover {
      opacity: 1;
    }

    .hero {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 20px; /* Prevents text hitting edges on mobile */
    }

    h1 {
      font-size: 3rem;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    /* Mobile Adjustment: Make font smaller on phones */
    @media (max-width: 600px) {
      h1 { font-size: 2rem; }
      nav { right: 20px; top: 20px; }
    }

    p {
      opacity: 0.6;
      font-size: 14px;
      max-width: 500px;
      margin: 0 auto;
      line-height: 1.6; /* Makes text easier to read */
    }
  </style>
</head>

<body>

  <nav>
    <a href="index.html">About</a>
    <a href="works.html">Works</a>
    <a href="contact.html">Contact</a>
  </nav>

    <div>
      <h1>Athul Sidheeque</h1>

      </p>
    </div>
  </section>
  
</body>
</html>
